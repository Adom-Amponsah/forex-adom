[project]
name = "mt5-analysis-engine"
version = "2.0.0"
description = "Multi-timeframe forex market analysis engine - deterministic core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pytz>=2024.1",
    "click>=8.1",
    "tqdm>=4.66",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]
# Windows-only; connects to a running MetaTrader 5 terminal
mt5 = [
    "MetaTrader5>=5.0.45",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin an explicit rule set so linting is reproducible across ruff versions.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true